# cargo-deny: licences (ADR-0003, NFR-LIC-05), advisories, bans and sources (NFR-SEC-07).

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa, no fixed version; client signing only: docs/adr/0004-rustsec-2023-0071.md" },
    { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained, no known flaw; a macro winfsp uses at build time, in no shipped code" },
]

[licenses]
version = 2
# The allow-list from ADR-0003. Changes need a new ADR.
# Slint is "GPL-3.0-only OR <Slint royalty-free> OR <Slint commercial>": accepted through its
# GPL-3.0-only alternative.
allow = [
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
# The list is fixed by the ADR, not by what the dependencies happen to use today.
unused-allowed-license = "allow"

[bans]
# Slint, winit and windows pull in several versions of some crates; visible, but not an error.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
