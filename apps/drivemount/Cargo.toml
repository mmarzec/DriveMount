[package]
name = "drivemount"
description = "DriveMount: mount remote file systems as Windows drives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "drivemount_app"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
drivemount-core = { workspace = true }
drivemount-nfs = { workspace = true }
drivemount-sftp = { workspace = true }
drivemount-vfs = { workspace = true }

[target.'cfg(windows)'.dependencies]
anyhow = { workspace = true }
drivemount-smb = { workspace = true }
drivemount-win = { workspace = true }
drivemount-winfsp = { workspace = true }
serde = { workspace = true }
slint = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Link arguments reach this package's own binary and tests. See build.rs.
[target.'cfg(windows)'.build-dependencies]
slint-build = { workspace = true }
winfsp = { workspace = true }

[dev-dependencies]
drivemount-vfs = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
i-slint-backend-testing = { workspace = true }
