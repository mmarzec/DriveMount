# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "fsm"
description = "FS Manager: mount remote file systems as Windows drives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fsm_app"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
fsm-core = { workspace = true }
fsm-nfs = { workspace = true }
fsm-sftp = { workspace = true }
fsm-vfs = { workspace = true }

[target.'cfg(windows)'.dependencies]
fsm-smb = { workspace = true }
fsm-win = { workspace = true }
fsm-winfsp = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Link arguments reach this package's own binary and tests. See build.rs.
[target.'cfg(windows)'.build-dependencies]
winfsp = { workspace = true }

[dev-dependencies]
fsm-vfs = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
