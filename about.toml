# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-about: THIRD-PARTY-LICENSES.html for the MSI and the zip (NFR-LIC-04), from
# scripts/package.ps1 with packaging/about.hbs.

# The allow-list of deny.toml (ADR-0003), so a crate with any other licence fails the build.
accepted = [
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
# What the shipped exe is built from: no dev- or build-only crates.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Our own crates are in LICENSE.
private = { ignore = true }
