# Test servers for backend integration tests (spec §10.2).
# Keys come from docker/gen-keys.sh; start everything with docker/servers.ps1 up.
name: fsm-test

x-sshd: &sshd
  build: ./docker/sshd
  image: fsm-test-sshd
  volumes:
    - ./docker/keys:/keys:ro

services:
  sshd:
    <<: *sshd
    ports:
      - "2222:22"
    # A disk that fills up, for the disk-full mapping (spec §5.8).
    tmpfs:
      - /srv/small:size=1m,mode=1777

  # The variants below exist to make a connection fail in one way each (see docker/README.md).
  sshd-nosftp:
    <<: *sshd
    command: ["-f", "/etc/ssh/sshd_config_nosftp"]
    ports:
      - "2223:22"

  sshd-twokeys:
    <<: *sshd
    command: ["-h", "/etc/ssh/ssh_host_rsa_key"]
    ports:
      - "2224:22"

  sshd-legacy:
    <<: *sshd
    command: ["-h", "/etc/ssh/ssh_host_rsa_key", "-o", "HostKeyAlgorithms=ssh-rsa"]
    ports:
      - "2225:22"

  sshd-brokensftp:
    <<: *sshd
    command: ["-f", "/etc/ssh/sshd_config_nosftp", "-o", "Subsystem=sftp /bin/false"]
    ports:
      - "2226:22"

  sshd-hungsftp:
    <<: *sshd
    command: ["-f", "/etc/ssh/sshd_config_nosftp", "-o", "Subsystem=sftp /bin/sleep 3600"]
    ports:
      - "2227:22"

  # FR-SSH-11. The target publishes no port and has a host key of its own, so only the jump host can
  # reach it, under a name only the jump host can resolve.
  sshd-bastion:
    <<: *sshd
    ports:
      - "2228:22"

  sshd-target:
    <<: *sshd
    command: ["-f", "/etc/ssh/sshd_config_rsa"]

  sshd-noforward:
    <<: *sshd
    command: ["-o", "AllowTcpForwarding=no"]
    ports:
      - "2229:22"

  # FR-SSH-14: a server without the OpenSSH extensions.
  proftpd:
    build: ./docker/proftpd
    image: fsm-test-proftpd
    volumes:
      - ./docker/keys:/keys:ro
    ports:
      - "2230:22"

  # Rekeys after every MiB, whichever way it travels.
  sshd-rekey:
    <<: *sshd
    command: ["-o", "RekeyLimit=1M"]
    ports:
      - "2231:22"

  # FR-SSH-13: paths laid out as Windows OpenSSH shows them, as far as a Linux server can.
  sshd-winpaths:
    <<: *sshd
    command: ["-f", "/etc/ssh/sshd_config_winpaths"]
    ports:
      - "2232:22"
