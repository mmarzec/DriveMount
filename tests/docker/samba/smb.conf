[global]
   server role = standalone server
   workgroup = WORKGROUP
   map to guest = never
   server min protocol = SMB2_10
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /dev/stdout

[a]
   path = /srv/a
   read only = no
   valid users = smbuser1 smbuser2
   force create mode = 0666
   force directory mode = 0777

[b]
   path = /srv/b
   read only = no
   valid users = smbuser1 smbuser2
   force create mode = 0666
   force directory mode = 0777

[ro]
   path = /srv/ro
   read only = yes
   valid users = smbuser1 smbuser2
