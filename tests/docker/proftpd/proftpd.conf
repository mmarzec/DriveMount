# SFTP only, with every optional extension off: the client's fallbacks must carry the whole contract
# suite (FR-SSH-14).
ModulePath /usr/lib/proftpd
ModuleControlsACLs insmod,rmmod allow user root
LoadModule mod_sftp.c

ServerType standalone
ServerName "fsm-test-proftpd"
DefaultServer on
Port 22
UseIPv6 off
User nobody
Group nogroup
MaxInstances 100
Umask 022

UseReverseDNS off
RequireValidShell off
AuthOrder mod_auth_unix.c
AllowOverwrite on
AllowStoreRestart on
# mod_sftp polls with these, so 0 fails at once. Long enough for the 1 GiB contract case.
TimeoutIdle 3600
TimeoutNoTransfer 3600
TimeoutStalled 3600

SFTPEngine on
SFTPHostKey /etc/proftpd/keys/ssh_host_rsa_key
SFTPAuthMethods password
SFTPLog /var/log/proftpd/sftp.log
SFTPExtensions -checkFile -copyFile -fsync -hardlink -homeDirectory -posixRename -spaceAvailable -statvfs -vendorID -versionSelect -xattr
