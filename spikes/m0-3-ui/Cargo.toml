[package]
name = "m0-3-ui"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Spike M0-3: Slint window, tray icon, Windows messages and toasts (throw-away)"

# Spikes stay outside the main workspace.
[workspace]

[dependencies]
# No default features: only the winit back-end and the software renderer. Accessibility stays on
# because NFR-UX-04 needs it, so its size and memory cost are part of the measurement.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "accessibility",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
raw-window-handle = "0.6"
tray-icon = "0.26"
# Same version as fsm-winfsp must use (spike M0-1).
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

# Spec §9 release settings, so the size and start-up numbers are the real ones.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
