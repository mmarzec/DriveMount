# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release (spec §9, plan M2-11): a tag vX.Y.Z builds drivemount.exe, the MSI, the setup exe and the
# portable zip (scripts/package.ps1), has SignPath sign them, writes sha256sums.txt and drafts a
# GitHub release with them. The draft is published by hand, after checking it.
#
# Signing (OD-3) is SignPath (SignPath Foundation's open-source programme). SignPath signs on its own
# servers, so package.ps1 runs step by step and three signing requests go between the steps (see
# packaging/signpath/artifact-configuration.xml). Each release-signing request waits for an approver
# in SignPath, for up to an hour. Origin verification needs every job on GitHub-hosted runners.
#
# Settings: the secret SIGNPATH_API_TOKEN (a CI user's token, with submitter rights on both policies)
# and the variables SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG. A tag uses the signing policy
# release-signing; a run by hand (workflow_dispatch) uses test-signing, which needs no approval, signs
# with a test certificate and drafts no release. Without SIGNPATH_ORGANIZATION_ID nothing is signed
# and a tag's draft says so at the top.
#
# GitHub only: Gitea Actions has neither SignPath's connector nor GitHub releases.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    permissions:
      contents: write # the draft release
      actions: read # SignPath's connector reads the uploaded artifacts
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      POLICY: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
      PACKAGE: ${{ github.workspace }}\target\package
      RELEASE_EXE: ${{ github.workspace }}\target\release\drivemount.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install

      # No cache: a release is built from nothing.
      - name: Install WinFsp
        shell: powershell
        run: scripts\install-winfsp.ps1

      - name: Install cargo-about and cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3,cargo-wix@0.3.9

      - name: Check the tag against the workspace version
        id: version
        shell: powershell
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'drivemount' }).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "the tag is $env:GITHUB_REF_NAME but drivemount's version is $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Fetch WiX and WinFsp
        shell: powershell
        run: scripts\get-release-tools.ps1 -Into "$env:RUNNER_TEMP\release-tools"

      - name: Build drivemount.exe and the MSI
        shell: powershell
        run: scripts\package.ps1 -Step Build -OutDir $env:PACKAGE

      - name: Sign drivemount.exe and the MSI
        if: env.SIGN == 'true'
        uses: ./.github/actions/signpath
        with:
          name: app
          files: |
            ${{ env.RELEASE_EXE }}
            ${{ env.PACKAGE }}\DriveMount-${{ steps.version.outputs.version }}-x64.msi
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.POLICY }}

      - name: Build the setup exe
        shell: powershell
        run: scripts\package.ps1 -Step Bundle -OutDir $env:PACKAGE

      - name: Take out the setup exe's engine
        if: env.SIGN == 'true'
        shell: powershell
        run: scripts\package.ps1 -Step Detach -OutDir $env:PACKAGE

      - name: Sign the engine
        if: env.SIGN == 'true'
        uses: ./.github/actions/signpath
        with:
          name: engine
          files: ${{ env.PACKAGE }}\obj\engine.exe
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.POLICY }}

      - name: Put the engine back
        if: env.SIGN == 'true'
        shell: powershell
        run: scripts\package.ps1 -Step Attach -OutDir $env:PACKAGE

      - name: Sign the setup exe
        if: env.SIGN == 'true'
        uses: ./.github/actions/signpath
        with:
          name: setup
          files: ${{ env.PACKAGE }}\DriveMount-${{ steps.version.outputs.version }}-setup.exe
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.POLICY }}

      - name: Portable zip and checksums
        shell: powershell
        run: |
          scripts\package.ps1 -Step Finish -OutDir $env:PACKAGE
          Get-Content "$env:PACKAGE\sha256sums.txt"

      # A release-signing signature must be valid and timestamped; a test-signing one only there.
      - name: Check the signatures
        if: env.SIGN == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $check = @($env:RELEASE_EXE) + (Get-ChildItem "$env:PACKAGE\*" -File -Include *.exe, *.msi).FullName
          foreach ($file in $check) {
            $signature = Get-AuthenticodeSignature $file
            "{0,-12} {1}  {2}" -f $signature.Status, $signature.SignerCertificate.Subject, (Split-Path -Leaf $file)
            if (-not $signature.SignerCertificate) { throw "$file is not signed" }
            if ($env:POLICY -eq 'release-signing') {
              if ($signature.Status -ne 'Valid') { throw "$file's signature is $($signature.Status)" }
              if (-not $signature.TimeStamperCertificate) { throw "$file's signature has no timestamp" }
            }
          }

      - name: Keep the artefacts on the run
        uses: actions/upload-artifact@v4
        with:
          name: drivemount-${{ steps.version.outputs.version }}
          path: |
            target/package/*.exe
            target/package/*.msi
            target/package/*.zip
            target/package/sha256sums.txt
          if-no-files-found: error

      - name: Draft the release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $sums = Get-Content "$env:PACKAGE\sha256sums.txt" -Raw
          $note = if ($env:SIGN -eq 'true') { '' } else {
            "**Unsigned build**: SignPath was not set up when this ran. Do not publish it as a release.`n`n"
          }
          $body = "${note}Download **DriveMount-$env:VERSION-setup.exe**: it installs WinFsp too when it is missing. " +
            "The MSI is for deployment tools (it needs WinFsp installed first), the zip is the portable exe.`n`n" +
            "SHA-256:`n`n``````text`n$sums```````n`n" +
            "Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). " +
            "See the [code signing policy](https://github.com/mmarzec/DriveMount#code-signing-policy).`n"
          # Without a byte order mark, which Windows PowerShell's Out-File would write.
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $body)
          $files = (Get-ChildItem $env:PACKAGE -File).FullName
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "DriveMount $env:VERSION" `
            --notes-file "$env:RUNNER_TEMP\notes.md" @files
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
