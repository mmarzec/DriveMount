# SPDX-License-Identifier: GPL-3.0-or-later
#
# Runs on GitHub Actions and on Gitea Actions, which also reads .github/workflows.
# Gitea runners (act_runner) must be registered with the labels ubuntu-latest and windows-latest.
# Each needs rustup, git, Node (for actions/checkout) and ssh-keygen (known_hosts tests); the Windows
# one also needs the MSVC build tools and LLVM (libclang, for winfsp-sys). scripts/install-winfsp.ps1
# installs WinFsp with its Developer feature, which takes administrator rights, unless it is there
# already. Its test jobs mount drives, so they have to run where the WinFsp driver can be used.
# rust-toolchain.toml selects the toolchain. The Ubuntu one also needs Docker Engine with Compose v2.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  licence-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX headers (NFR-LIC-01)
        run: sh scripts/check-spdx.sh

  secret-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that secrets stay out of formatting macros (NFR-SEC-02)
        run: sh scripts/check-secret-format.sh

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\install-winfsp.ps1
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: deny
        run: cargo deny --locked check
      - name: audit
        run: cargo audit

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\install-winfsp.ps1
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked

  # Mounted drives beyond what `test` runs on MemFs: the same tests over a real SFTP session with a
  # server inside the test process, and WinFsp's own test suite (spec 10.3).
  drives:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\install-winfsp.ps1
      - name: The drive tests over SFTP
        env:
          DRIVEMOUNT_TEST_SERVER: sftp
        run: cargo test -p drivemount-winfsp --locked --test read_path --test write_path --test fsx
      - name: Fetch winfsp-tests
        shell: powershell
        run: scripts\get-winfsp-tests.ps1
      - name: winfsp-tests, less tests/winfsp-tests-exclusions.txt
        run: cargo test -p drivemount-winfsp --locked --test winfsp_tests -- --ignored --test-threads=1 --nocapture

  # SMB mappings through the runner's own Windows server (plan M3-05): a share and two local users
  # made for the run, so the job needs administrator rights, as GitHub-hosted runners have. Samba
  # and the outage test stay local (crates/drivemount-smb/tests/samba.rs), as WSL2 does not run here.
  smb:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test -p drivemount-smb --locked --test local_share --no-run
      - name: Make the test share and its users
        shell: powershell
        run: scripts\smb-test-share.ps1 -EnvFile $env:GITHUB_ENV
      - name: The SMB tests against it
        run: cargo test -p drivemount-smb --locked --test local_share -- --ignored --test-threads=1
      - name: Remove the test share and its users
        if: always()
        shell: powershell
        run: scripts\smb-test-share.ps1 -Remove -EnvFile $env:GITHUB_ENV

  # The tests marked #[ignore]: they need the S-03 servers, which this job starts with Docker Engine.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test -p drivemount-sftp --locked --no-run
      - name: Start the test servers
        # All but knfsd, which the nfs job runs on a runner of its own.
        run: |
          bash tests/docker/gen-keys.sh
          docker compose -f tests/docker-compose.yml up -d --build --wait             $(docker compose -f tests/docker-compose.yml config --services | grep -vx nfs)
      - name: test
        run: cargo test -p drivemount-sftp --locked -- --ignored

  # NfsFs and NfsConnector against knfsd (plan M4-06): the contract suite, ownership, links, the
  # read-only export, reserved ports (FR-NFS-03), a copy across a server restart (FR-NFS-04) and
  # E-NFS-ACCESS (FR-NFS-05). knfsd is the runner's own kernel server, configured by the `nfs`
  # container on the host's network, so the tests reach it at localhost. The drive tests over NFS
  # (apps/drivemount/tests/nfs_drive.rs, fsx among them) need WinFsp and stay on the dev machine.
  nfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test -p drivemount-nfs --locked --no-run
      - name: Prepare the runner for knfsd
        # nfsd may sit in linux-modules-extra; the container brings its own portmapper on 111. A
        # reserved source port needs root on Linux unless the unprivileged range starts at 0.
        run: |
          sudo modprobe nfsd || { sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe nfsd; }
          sudo systemctl stop rpcbind.socket rpcbind.service 2>/dev/null || true
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Start knfsd
        run: docker compose -f tests/docker-compose.yml up -d --build --wait nfs
      - name: test
        run: cargo test -p drivemount-nfs --locked -- --ignored --test-threads=1
      - name: knfsd's log
        if: failure()
        run: docker compose -f tests/docker-compose.yml logs nfs

  exe-size:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        shell: powershell
        run: scripts\install-winfsp.ps1
      - name: Build release drivemount.exe
        run: cargo build --release -p drivemount --locked
      - name: Check size (NFR-PERF-03)
        shell: powershell
        run: scripts\check-exe-size.ps1
