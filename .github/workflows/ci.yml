# SPDX-License-Identifier: GPL-3.0-or-later
#
# Runs on GitHub Actions and on Gitea Actions, which also reads .github/workflows.
# Gitea runners (act_runner) must be registered with the labels ubuntu-latest and windows-latest.
# Each needs rustup, git, Node (for actions/checkout) and ssh-keygen (known_hosts tests); the Windows
# one also needs the MSVC build tools and LLVM (libclang, for winfsp-sys). scripts/install-winfsp.ps1
# installs WinFsp with its Developer feature, which takes administrator rights, unless it is there
# already. Its test jobs mount drives, so they have to run where the WinFsp driver can be used.
# rust-toolchain.toml selects the toolchain. The Ubuntu one also needs Docker Engine with Compose v2.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  licence-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers (NFR-LIC-01)
        run: sh scripts/check-spdx.sh

  secret-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that secrets stay out of formatting macros (NFR-SEC-02)
        run: sh scripts/check-secret-format.sh

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\install-winfsp.ps1
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: deny
        run: cargo deny --locked check
      - name: audit
        run: cargo audit

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\install-winfsp.ps1
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked

  # Mounted drives beyond what `test` runs on MemFs: the same tests over a real SFTP session with a
  # server inside the test process, and WinFsp's own test suite (spec 10.3).
  drives:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\install-winfsp.ps1
      - name: The drive tests over SFTP
        env:
          DRIVEMOUNT_TEST_SERVER: sftp
        run: cargo test -p drivemount-winfsp --locked --test read_path --test write_path --test fsx
      - name: Fetch winfsp-tests
        shell: powershell
        run: scripts\get-winfsp-tests.ps1
      - name: winfsp-tests, less tests/winfsp-tests-exclusions.txt
        run: cargo test -p drivemount-winfsp --locked --test winfsp_tests -- --ignored --test-threads=1 --nocapture

  # The tests marked #[ignore]: they need the S-03 servers, which this job starts with Docker Engine.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test -p drivemount-sftp --locked --no-run
      - name: Start the test servers
        run: |
          bash tests/docker/gen-keys.sh
          docker compose -f tests/docker-compose.yml up -d --build --wait
      - name: test
        run: cargo test -p drivemount-sftp --locked -- --ignored

  exe-size:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      - name: Install WinFsp
        shell: powershell
        run: scripts\install-winfsp.ps1
      - name: Build release drivemount.exe
        run: cargo build --release -p drivemount --locked
      - name: Check size (NFR-PERF-03)
        shell: powershell
        run: scripts\check-exe-size.ps1
